<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#080e1a" />
    </linearGradient>

    <radialGradient id="radial-purple" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="radial-cyan" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="radial-blue" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="line-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="line-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Animations -->
    <style>
      @keyframes dash {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes float-1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-7px) rotate(0.5deg); }
      }
      @keyframes float-2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(7px) rotate(-0.5deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.08); }
      }
      @keyframes beacon {
        0% { r: 4px; opacity: 1; }
        100% { r: 16px; opacity: 0; }
      }
      @keyframes beam-flow {
        0% { stroke-dashoffset: 1000; }
        100% { stroke-dashoffset: 0; }
      }
      .anim-flow-1 {
        stroke-dasharray: 12, 8;
        animation: dash 14s linear infinite;
      }
      .anim-flow-2 {
        stroke-dasharray: 8, 12;
        animation: dash 18s linear infinite reverse;
      }
      .float-group-1 {
        animation: float-1 6s ease-in-out infinite;
      }
      .float-group-2 {
        animation: float-2 7s ease-in-out infinite;
      }
      .pulse-glow {
        animation: pulse 4s ease-in-out infinite;
      }
      .radar-ring {
        animation: beacon 2.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bg)" />
  <rect width="1200" height="420" fill="url(#radial-purple)" />
  <rect width="1200" height="420" fill="url(#radial-cyan)" />
  <rect width="1200" height="420" fill="url(#radial-blue)" />

  <!-- Geometric Grid Pattern (Subtle) -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="120" y1="0" x2="120" y2="420" />
    <line x1="240" y1="0" x2="240" y2="420" />
    <line x1="360" y1="0" x2="360" y2="420" />
    <line x1="480" y1="0" x2="480" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="720" y1="0" x2="720" y2="420" />
    <line x1="840" y1="0" x2="840" y2="420" />
    <line x1="960" y1="0" x2="960" y2="420" />
    <line x1="1080" y1="0" x2="1080" y2="420" />
  </g>

  <!-- Dynamic / Animated Workflow Flow Lines (Behind text) -->
  <g fill="none">
    <!-- Curved flow 1: Top-Left to Bottom-Right -->
    <path d="M 40 100 C 300 40, 450 180, 800 110 C 980 65, 1080 180, 1160 160"
          stroke="url(#line-grad-1)" stroke-width="2.5" class="anim-flow-1" />

    <!-- Curved flow 2: Bottom-Left to Top-Right -->
    <path d="M 50 340 C 320 380, 500 240, 750 330 C 950 390, 1060 260, 1150 290"
          stroke="url(#line-grad-2)" stroke-width="2.5" class="anim-flow-2" />

    <!-- Additional dynamic pipeline connection -->
    <path d="M 150 50 L 250 110 L 320 80" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="4,4" />
    <path d="M 880 340 L 960 300 L 1050 350" stroke="#a855f7" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="4,4" />
  </g>

  <!-- Animated Pulse Nodes / Hubs (Located away from center text) -->
  <g>
    <!-- Node 1: Left -->
    <g transform="translate(100, 120)">
      <circle cx="0" cy="0" r="14" fill="#6366f1" fill-opacity="0.2" />
      <circle cx="0" cy="0" r="8" fill="#6366f1" class="radar-ring" stroke="#818cf8" stroke-width="1.5" fill-opacity="0" />
      <circle cx="0" cy="0" r="5" fill="#a5b4fc" />
    </g>

    <!-- Node 2: Far Right -->
    <g transform="translate(1100, 310)">
      <circle cx="0" cy="0" r="14" fill="#06b6d4" fill-opacity="0.2" />
      <circle cx="0" cy="0" r="8" fill="#06b6d4" class="radar-ring" stroke="#38bdf8" stroke-width="1.5" fill-opacity="0" />
      <circle cx="0" cy="0" r="5" fill="#67e8f9" />
    </g>

    <!-- Node 3: Top Right -->
    <g transform="translate(1060, 110)">
      <circle cx="0" cy="0" r="12" fill="#8b5cf6" fill-opacity="0.25" />
      <circle cx="0" cy="0" r="4" fill="#c084fc" />
    </g>

    <!-- Node 4: Bottom Left -->
    <g transform="translate(120, 320)">
      <circle cx="0" cy="0" r="12" fill="#3b82f6" fill-opacity="0.25" />
      <circle cx="0" cy="0" r="4" fill="#60a5fa" />
    </g>
  </g>

  <!-- Dynamic Animated Floating Badges / Pills (Periphery, kept away from center title) -->
  <!-- Top Left Pill -->
  <g class="float-group-1" transform="translate(80, 42)">
    <rect width="185" height="34" rx="17" fill="#0f172a" fill-opacity="0.85" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1.5" filter="url(#card-shadow)" />
    <circle cx="20" cy="17" r="5" fill="#38bdf8" />
    <text x="34" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">⚡ iPaaS &amp; Webhooks</text>
  </g>

  <!-- Top Right Pill -->
  <g class="float-group-2" transform="translate(930, 42)">
    <rect width="195" height="34" rx="17" fill="#0f172a" fill-opacity="0.85" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1.5" filter="url(#card-shadow)" />
    <circle cx="20" cy="17" r="5" fill="#c084fc" />
    <text x="34" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">🤖 AI Workflow Agents</text>
  </g>

  <!-- Bottom Left Pill -->
  <g class="float-group-2" transform="translate(70, 348)">
    <rect width="215" height="34" rx="17" fill="#0f172a" fill-opacity="0.85" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5" filter="url(#card-shadow)" />
    <circle cx="20" cy="17" r="5" fill="#34d399" />
    <text x="34" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">🛡️ Self-Hosted Sovereignty</text>
  </g>

  <!-- Bottom Right Pill -->
  <g class="float-group-1" transform="translate(915, 348)">
    <rect width="210" height="34" rx="17" fill="#0f172a" fill-opacity="0.85" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.5" filter="url(#card-shadow)" />
    <circle cx="20" cy="17" r="5" fill="#fbbf24" />
    <text x="34" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">🔄 DAG &amp; Event Pipelines</text>
  </g>

  <!-- ===================================================================== -->
  <!-- FOREGROUND CONTENT: High-contrast, unobstructed, always visible on top -->
  <!-- ===================================================================== -->
  
  <!-- Subtle center backing glow to ensure pristine text readability -->
  <rect x="180" y="95" width="840" height="230" rx="20" fill="#0a0f1d" fill-opacity="0.75" stroke="#1e293b" stroke-width="1" filter="url(#card-shadow)" />

  <!-- Top Category Tag -->
  <g transform="translate(600, 136)">
    <rect x="-165" y="-14" width="330" height="28" rx="14" fill="url(#badge-grad)" fill-opacity="0.15" stroke="url(#badge-grad)" stroke-width="1.2" />
    <text x="0" y="5" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" letter-spacing="2">
      ENTERPRISE ARCHITECTURE &amp; AUTOMATION
    </text>
  </g>

  <!-- Main Headline Title -->
  <text x="600" y="202" fill="url(#title-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="37" font-weight="900" text-anchor="middle" letter-spacing="-0.5" filter="drop-shadow(0px 3px 6px rgba(0,0,0,0.85))">
    Enterprise Workflow Automation &amp; Integration
  </text>

  <!-- Subtitle -->
  <text x="600" y="242" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" letter-spacing="0.2">
    Curated Hub of Cloud iPaaS Suites, Open-Source Orchestrators &amp; Self-Hosted Systems
  </text>

  <!-- Status / Feature Highlights Footer Row -->
  <g transform="translate(600, 288)">
    <text x="0" y="0" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" text-anchor="middle">
      <tspan fill="#38bdf8">✦</tspan> Visual Flow Builders  
      <tspan fill="#64748b" dx="8">|</tspan>  
      <tspan fill="#a855f7" dx="8">✦</tspan> Code-First DAGs  
      <tspan fill="#64748b" dx="8">|</tspan>  
      <tspan fill="#34d399" dx="8">✦</tspan> AI Agent Execution  
      <tspan fill="#64748b" dx="8">|</tspan>  
      <tspan fill="#f59e0b" dx="8">✦</tspan> Zero Vendor Lock-in
    </text>
  </g>

</svg>